":"match","question":"3. Match each issue to the best fix priority:","pairs":[{"left":"Answer goes off-topic","right":"Strengthen goal or context"},{"left":"Output becomes one long wall of text","right":"Add structure constraints"},{"left":"Tone sounds too adult","right":"Specify audience or add style examples"},{"left":"Includes unsupported facts","right":"Require evidence and unknown markers"}]},{"type":"quiz","question":"4. V1 should be a 60-word activity notice but outputs 180 words. What is the best V2 single-point fix?","options":["Change topic and tone while adding five examples at once","Add \"within 60 words, three-sentence format\"","Delete all constraints except the event name"],"correct":1},{"type":"quiz","question":"5. After adding \"within 60 words\" in V2, how do you test whether the fix worked?","options":["Use the same task to compare V1 and V2 word counts while checking content completeness","Compare V2 length with an unrelated story","Check only whether V2 uses fancier words"],"correct":0},{"type":"match","question":"6. Match the three-round workflow:","pairs":[{"left":"V1","right":"Minimum usable spell"},{"left":"Observe","right":"Record one concrete issue"},{"left":"V2","right":"Apply one targeted fix"},{"left":"V3","right":"Fix one new remaining issue"}]},{"type":"quiz","question":"7. Why should you avoid adding ten new rules at once in V2?","options":["Any prompt with over three rules always fails","AI cannot read numbered instructions","You cannot tell which rule caused improvement, and rules may conflict"],"correct":2},{"type":"fill","question":"8. \"Too formal\" is only a symptom. A better diagnosis is \"sounds like a letter to teachers, not aligned with student ___.\"","parts":["not aligned with student","___","."],"options":["tone","length","source scope"],"correct":"tone"},{"type":"match","question":"9. What should iteration logs keep?","pairs":[{"left":"Each prompt version","right":"Shows what changed"},{"left":"Its output","right":"Shows result differences"},{"left":"Issue description","right":"Avoids vague comments like \"not good\""},{"left":"Single-change note","right":"Supports causal judgment"}]},{"type":"quiz","question":"10. V2 fixed word count, but the title is still weak for classmates. What is the best V3 move?","options":["Keep the word-count rule and add only one title-style requirement","Delete V2 constraints and rewrite from scratch","Skip recording the title issue and submit V2"],"correct":0},{"type":"fill","question":"11. \"The answer is wrong\" is too vague. \"Point 2 lacks evidence from observations\" is a ___ diagnosis.","parts":["That is a","___","diagnosis."],"options":["specific","holistic","subjective"],"correct":"specific"},{"type":"quiz","question":"12. In story writing, V2 length is fine but the main character no longer feels like a student. Best V3 single-point fix?","options":["Remove all existing constraints","Add character age and school context","Add ten rules at once for title, ending, and tone"],"correct":1},{"type":"quiz","question":"13. Why test V1, V2, and V3 on the same task?","options":["To fairly compare before-and-after effect of a specific change","So you can skip observing outputs","So each generation is guaranteed to be identical"],"correct":0},{"type":"quiz","question":"14. V2 changed topic, tone, and format together, and output improved. What is the biggest problem now?","options":["You cannot tell which change caused the improvement","The more changes in one round, the more reliable the conclusion","If output improves, logging is unnecessary"],"correct":0},{"type":"match","question":"15. Match the three-round debugging ability card:","pairs":[{"left":"See what is unsatisfying","right":"Observe"},{"left":"Explain the concrete reason","right":"Diagnose"},{"left":"Change only one thing","right":"Single-point edit"},{"left":"Keep before-and-after outputs","right":"Compare"}]},{"type":"theory","content":"Dragon Ability Card: V1 -> V2 -> V3 debug log.\n\nUse this structure: version | concrete issue | one thing changed this round | output change. Three rounds are not about instant perfection. They are about evidence for each change."}]}},{"week":2,"data":{"day":7,"title":"Dragon Spell Boss: Seven-part Prompt System","shards":1,"isBoss":true,"steps":[{"type":"theory","content":"Final move: assemble a seven-part Prompt System with System, User, Context, Examples, Constraints, Evaluation, and Stop Conditions. The goal is reusable, testable, and regression-friendly prompts."},{"type":"video","url":"","content":"Video coming next: assemble this week's components into a bounded personalized learning companion."},{"type":"theory","content":"Module roles: System holds long-term safety rules; User holds this-turn task; Context holds reference data; Examples holds a few high-quality demos; Constraints holds hard boundaries; Evaluation holds rubric and test suite; Stop Conditions define when to stop and ask for help."},{"type":"theory","content":"Critical boundaries: do not ghostwrite homework, quizzes, or competitions; do not fabricate sources; do not spread personal data; and mark uncertain knowledge as needing verification. A good companion asks \"How far have you tried?\" and offers hints or parallel practice instead of submitting finished work."},{"type":"quiz","question":"1. When writing a System Prompt for a personalized learning companion, what belongs in long-term rules?","options":["A full answer to one homework question","The learner's real legal name","The AI's identity, boundaries, and help style"],"correct":2},{"type":"fill","question":"2. A responsible learning companion should learn the student's grade, interests, and ___ first, not ask for private data.","parts":["It should also learn the student's","___","."],"options":["goal","homework page count","response format"],"correct":"goal"},{"type":"match","question":"3. Match each companion section:","pairs":[{"left":"## Identity","right":"State it is a patient learning companion"},{"left":"## Learn About the Student","right":"Grade level, interests, current goal"},{"left":"## Help Style","right":"Ask first, then provide layered hints"},{"left":"## Boundaries","right":"No ghostwriting for homework or quizzes"}]},{"type":"quiz","question":"4. A student says \"just finish this homework for me.\" What is the best response?","options":["Ask what they have tried so far, then offer hints or a parallel example","Directly submit a complete answer ready to turn in","Require personal profile data before helping"],"correct":0},{"type":"fill","question":"5. A learning companion must not complete submit-ready homework for students. This is a ___.","parts":["This is a","___","."],"options":["boundary","context","heading"],"correct":"boundary"},{"type":"match","question":"6. Match learner needs with companion behavior:","pairs":[{"left":"Cannot understand a concept","right":"Explain with age-appropriate analogy"},{"left":"Stuck in the middle of a question","right":"Give the next hint, not the full answer"},{"left":"Preparing a class presentation","right":"Help draft the outline, let student fill details"},{"left":"Uncertain source quality","right":"Recommend source verification"}]},{"type":"quiz","question":"7. Why include \"do not fabricate sources\" in companion rules?","options":["To ban all examples","To force the companion to answer only \"I don't know\"","To prevent guesses from being treated as reliable knowledge"],"correct":2},{"type":"quiz","question":"8. A student is stuck on one exercise. Which reply best supports real learning?","options":["Ask what they have tried, give one next-step hint, then wait for their attempt","Provide a complete answer and ask them to copy it","Switch to an easier question and skip the original one"],"correct":0},{"type":"match","question":"9. How should personalization info be used?","pairs":[{"left":"Likes astronomy","right":"Use sky-related analogies when useful"},{"left":"Grade 7","right":"Control terminology difficulty"},{"left":"Goal is class presentation","right":"Support speech-outline building"},{"left":"Information student does not want to share","right":"Do not press, store, or spread it"}]},{"type":"quiz","question":"10. Which help-style rule best builds self-learning ability?","options":["Always give the standard answer first, then explain","Ask for known conditions and prior attempts first, then give one next-step hint","Immediately replace difficult questions with easier ones"],"correct":1},{"type":"fill","question":"11. For complex questions, the companion can loop as: problem -> hint -> student attempt -> ___.","parts":["After the student attempt, provide","___","."],"options":["feedback","final answer","new assignment"],"correct":"feedback"},{"type":"quiz","question":"12. During a live quiz, what is the best behavior for the companion?","options":["Refuse direct answering and teach a general method or offer post-quiz parallel practice","Answer only the two hardest items","Ask student to upload classmates' answers as reference"],"correct":0},{"type":"quiz","question":"13. What can you define in the companion's response format?","options":["Must use advanced terminology to sound professional","Start with one encouragement sentence, then provide at most three hints","Never ask what the student already tried"],"correct":1},{"type":"quiz","question":"14. How should the rule \"do not complete submit-ready homework\" be written for reliability?","options":["State it explicitly as a long-term boundary and explain hint-based alternatives","Mention it casually at the end of one example","Decide case by case only when students request answers"],"correct":0},{"type":"match","question":"15. Boss ability card: four companion commitments:","pairs":[{"left":"Personalized support","right":"Adjust by grade, interests, and goals"},{"left":"Guide before giving help","right":"Hints first, no direct submission-ready answers"},{"left":"Honest and reliable","right":"State uncertainty and suggest verification"},{"left":"Strong boundaries","right":"No ghostwriting, no privacy overreach"}]},{"type":"theory","content":"Dragon Ability Card: Personalized Learning Companion System Prompt.\n\nYour final package should include clear identity, learner understanding, layered support, stable response format, and firm boundaries. The best companion does not fly for you. It helps you grow your own wings."}]}},{"week":3,"data":{"day":1,"title":"Multimodal Engine I: Pixels, Patches, Visual Tokens, Encoder, and Text-Image Alignment","shards":30,"steps":[{"type":"theory","content":"🐉 **Image Understanding Pipeline**\n\nToday we decode how AI “reads” images: pixels are cut into patches, patches become visual tokens, tokens pass through the encoder, and then align with language space."},{"type":"video","url":"","content":"Upcoming video: turn a public science source into a 15-30-second knowledge short script"},{"type":"theory","content":"📚 **Mechanism Card 1 | Pixels to Patches**\nSmaller patches mean more visual tokens. You keep more detail, but computation cost rises. Resolution and patch size directly affect readable detail."},{"type":"theory","content":"🎯 **Mechanism Card 2 | Visual Tokens and Encoder**\nVisual tokens are not words. They are vectors for color, texture, edges, and structure. The encoder compresses them into computable representations for cross-modal alignment."},{"type":"theory","content":"🧹 **Mechanism Card 3 | Text-Image Alignment**\n“Describe what you see” works because image and language are trained into a shared semantic space. But high similarity is not equal to factual correctness. You still need evidence checks."},{"type":"quiz","question":"1. Which source is best to give AI for first-pass reading?","options":["A classmate's private family details","Internal files from unknown sources","A public science article on the school website","A contact list from group chat"],"correct":2},{"type":"quiz","question":"2. Which instruction gives AI the clearest reading task?","options":["State the goal, number of facts, and original locations","Shorten the whole text and remove citations","Guess the full article from the title","Only copy sentences that support your opinion"],"correct":0},{"type":"quiz","question":"3. AI says “the original text does not mention this.” What should you do?","options":["Fill it in using common sense","Write the AI claim as fact","Pick the webpage with stronger wording","Mark it as “to verify” and check the source text"],"correct":3},{"type":"quiz","question":"4. What is the most important check before sharing materials?","options":["Only check if the file opens","Only remove names from the title","Check personal data like names, phone numbers, and addresses","Let AI judge everything by itself"],"correct":2},{"type":"quiz","question":"5. Why should you state your goal before reading long material?","options":["So output is organized around your task goal","So AI automatically judges truthfulness","So original locations are no longer needed","So AI can do all verification alone"],"correct":0},{"type":"quiz","question":"6. If AI summary conflicts with the source text, what is the standard?","options":["Choose the version you prefer","Go back to the source text and re-check","Treat both as facts","Use whichever version is longer"],"correct":1},{"type":"fill","question":"7. First safety gate: use only public content or content with ___ permission.","parts":["Use only public content or content with","___","permission."],"options":["authorized","licensed","agreed"],"correct":"authorized"},{"type":"fill","question":"8. When asking AI to find facts, require the original text ___.","parts":["When asking AI for facts, also require original text","___","."],"options":["locations","authors","summaries"],"correct":"locations"},{"type":"fill","question":"9. Phone numbers and home addresses are protected ___.","parts":["Phone numbers and home addresses are protected","___","."],"options":["personal information","public information","browsing history"],"correct":"personal information"},{"type":"quiz","question":"10. A reading card says “Volcanoes all erupt at night” but gives no source location. Best handling?","options":["Mark it “to verify,” return to the source for evidence, and remove it if unsupported","Keep it and just make the tone more certain","Ask AI to invent a likely paragraph location"],"correct":0},{"type":"practice","task":"11. [Script Draft] Pick one fact from a public source (museum, school, or science institution) and write a 15-30-second knowledge short script. Include: a hook question, one sourced core fact, and a takeaway ending.","rubric":"Must include hook, core fact, and ending. Fact must include a public source or source location. Script should fit a 15-30-second voice-over and must not add unsupported claims or personal information.","placeholder":"Hook: ...\nCore fact (source): ...\nEnding: ...","minLength":50,"referenceAnswer":"Hook: Why does the Moon look bright at night? Core fact: The Moon does not emit its own light; it reflects sunlight (source: paragraph 2 of a public planetarium page). Ending: Moonlight is actually sunlight taking a detour."},{"type":"match","question":"12. Match: material-handling actions","pairs":[{"left":"File contains a classmate's phone number","right":"Remove sensitive info or switch to a public source"},{"left":"Material comes from a museum official site","right":"Good priority source to read first"},{"left":"AI says source does not mention a claim","right":"Return to source and mark as “to verify”"},{"left":"Article has no publish date","right":"Mark date as unknown on the reading card"}]},{"type":"match","question":"13. Match: reading card sections","pairs":[{"left":"Volcanoes can release gases","right":"Fact section"},{"left":"Paragraph 3, sentence 2","right":"Source location section"},{"left":"Museum webpage link","right":"Link/source section"},{"left":"When did volcanoes form?","right":"To-verify question section"}]},{"type":"match","question":"14. Match: prompt parts","pairs":[{"left":"Science explainer for Grade 7 students","right":"Defines audience"},{"left":"List three volcano facts","right":"Defines task and quantity"},{"left":"Add paragraph number after each fact","right":"Requires source locations"},{"left":"Do not guess details not in source","right":"Sets constraints"}]},{"type":"match","question":"15. Match: good habits","pairs":[{"left":"AI summary includes a number","right":"Open source text and find the exact sentence"},{"left":"File contains a home address","right":"Do not upload; remove personal data"},{"left":"Webpage says “may form”","right":"Mark as possibility, not fact"},{"left":"Still unsure after reading","right":"Write it into “to verify” questions"}]},{"type":"theory","content":"✅ **Store in Your Project Box**\nSave your source card and first 15-30-second narration draft. Tomorrow you will let AI read an image tied to your topic and separate “what is visible” from “what we infer.”"}]}},{"week":3,"data":{"day":2,"title":"Multimodal Diagnosis: OCR, Objects, Spatial Reasoning, Charts, and Visual Hallucinations","shards":30,"steps":[{"type":"theory","content":"👁️ **Opening | Five Image Understanding Abilities**\nToday we split image understanding into OCR, object recognition, spatial relations, chart reading, and visual hallucinations. Goal: separate “what is seen” from “what is imagined.”"},{"type":"video","url":"","content":"Video placeholder: how one image moves from observation to careful interpretation"},{"type":"theory","content":"🔍 **Theory Card 1 | OCR and Object Recognition**\nOCR can fail under blur, tilt, or occlusion. Object recognition can misclassify similar outlines as common objects."},{"type":"theory","content":"🧩 **Theory Card 2 | Spatial and Chart Understanding**\nLeft-right, front-back, and occlusion relationships are frequent error points. Chart errors often come from wrong axes or units."},{"type":"theory","content":"🌫️ **Theory Card 3 | Visual Hallucinations**\nWhen evidence is weak, models may auto-complete with learned patterns and produce believable mistakes. Low-confidence regions should be explicitly marked as uncertain."},{"type":"quiz","question":"1. When looking at an unfamiliar image, what is the most reliable first step?","options":["Write what is directly visible in the picture","Guess what the photographer wanted to express","Judge the character's personality first","Invent what happened outside the frame"],"correct":0},{"type":"quiz","question":"2. Which sentence is an observation, not an interpretation?","options":["The boy is probably lost","There is an open blue book on the right side of the desk","The dark sky means everyone is sad","This classroom just finished an exam"],"correct":1},{"type":"quiz","question":"3. A faraway sign is blurry in the image. How should you record it?","options":["Write the text that looks closest","Ask AI to guess multiple times and pick the majority","Mark it as unconfirmed and note where it is blurry","Ignore blur and treat it as clear text"],"correct":2},{"type":"quiz","question":"4. AI says “This photo was taken in winter,” but the picture only shows coats. Correct judgment?","options":["Coats are enough proof of winter","This is only a possible interpretation; still need date/location evidence","AI vision conclusions can be used directly","Coats have nothing to do with season at all"],"correct":1},{"type":"quiz","question":"5. Why can cropped images cause wrong judgments?","options":["Cropping always changes pixel colors","Cropping automatically creates fake objects","Context around the scene may be removed","Cropped images are always fake"],"correct":2},{"type":"quiz","question":"6. If you want to use an image in a knowledge short, what check matters most?","options":["Only check if it looks pretty","Ensure observations match script facts, and verify source and usage permission","Ask AI to invent a more dramatic story","If there is no text, it is always safe to use"],"correct":1},{"type":"fill","question":"7. “There is a bright Moon in the upper-left corner” is a visible ___.","parts":["This sentence is a visible","___","."],"options":["observation","interpretation","guess"],"correct":"observation"},{"type":"fill","question":"8. “This may be around a lunar eclipse” should be labeled as ___.","parts":["This sentence should be labeled as a","___","."],"options":["possible interpretation","confirmed fact","text from image"],"correct":"possible interpretation"},{"type":"fill","question":"9. For details you cannot confirm from one image, record the ___.","parts":["You should record the","___","."],"options":["uncertainty","standard answer","story ending"],"correct":"uncertainty"},{"type":"quiz","question":"10. There is a cup with a few drops nearby. Which statement is most accurate?","options":["The cup was just taken from a fridge","The water must leak from the cup","Visible drops are next to the cup; the cause cannot be confirmed from this image"],"correct":2},{"type":"practice","task":"11. [Image Observation Card] Choose one image with clear source and no privacy issues. For your D1 story, write an observation card with at least 3 visible details, 1 possible interpretation, 2 uncertainties, and which line of your script it supports.","rubric":"Must clearly separate observation, interpretation, and uncertainty; include at least three observations, one interpretation using words like “may,” and two unconfirmed points; connect accurately to your script line. Do not write guesses as facts.","placeholder":"Image source: ...\nVisible details: 1. ... 2. ... 3. ...\nPossible interpretation: ...\nUncertainties: 1. ... 2. ...\nSupported script line: ...","minLength":70,"referenceAnswer":"Image source: a photo I took of a Moon model. Visible details: a gray sphere at center; a white beam from the right; the left side is darker. Possible interpretation: the bright-dark contrast may come from right-side lighting. Uncertainties: model material cannot be confirmed from the photo alone; real Moon size is not provable from this image. Supported script line: lighting creates bright and dark sides on a sphere."},{"type":"match","question":"12. Match: observation, interpretation, uncertainty","pairs":[{"left":"A gray sphere is in the center","right":"Observation"},{"left":"It may represent the Moon","right":"Interpretation"},{"left":"Shooting location cannot be confirmed","right":"Uncertainty"},{"left":"Image comes from a museum public page","right":"Source information"}]},{"type":"match","question":"13. Match: visual factors and risks","pairs":[{"left":"Very few pixels in far text","right":"Text may be read incorrectly"},{"left":"Wide-angle lens close to subject","right":"Proportions may be exaggerated"},{"left":"Strong shadows on edges","right":"Shape may be misread"},{"left":"Only one corner is cropped out","right":"Context may be missing"}]},{"type":"match","question":"14. Match: actions after finding a problem","pairs":[{"left":"AI sees an object that is not in the original image","right":"Recheck original image and delete false description"},{"left":"Date appears only in caption text","right":"Verify it from the original source"},{"left":"Detail is too blurry","right":"Mark unconfirmed or switch to clearer image"},{"left":"Image license is unclear","right":"Do not use it yet; find usable material"}]},{"type":"match","question":"15. Match: observation card sections","pairs":[{"left":"Three directly visible details","right":"Visible details"},{"left":"Reason statement with “may”","right":"Possible interpretation"},{"left":"Questions one image cannot answer","right":"Uncertainties"},{"left":"One line mapped to D1 script","right":"Script connection"}]},{"type":"theory","content":"✅ **Wrap-up | Observation Card Complete**\nYou now have source info, at least three visible details, one possible interpretation, two uncertainties, and a mapped D1 script line. Tomorrow we turn reliable clues into a key visual."}]}},{"week":3,"data":{"day":3,"title":"Image Generation Engine: Diffusion, Latent Space, Seed, Steps, CFG","shards":30,"steps":[{"type":"theory","content":"🎨 **Opening | From Noise to Image**\nNow we switch to the “image-making” engine: diffusion denoises step by step in latent space. Today's key controls are Seed, Steps, and CFG."},{"type":"video","url":"","content":"Video placeholder: use a five-part prompt to turn your script into a usable key visual"},{"type":"theory","content":"🧱 **Theory Card 1 | Latent Space and Seed**\nSeed is like a random starting index. With the same model and parameters, it tends to reproduce style direction; different seeds create variation in details."},{"type":"theory","content":"🧭 **Theory Card 2 | Steps and CFG**\nSteps control denoising iterations. CFG controls prompt-following strength. Too low may drift off-topic; too high may become rigid and add artifacts."},{"type":"theory","content":"✅ **Theory Card 3 | Parameter Experiment Discipline**\nRun single-variable experiments: hold Seed fixed while changing Steps or CFG, or hold parameters fixed and only change Seed. Otherwise you cannot identify what caused changes."},{"type":"quiz","question":"1. When turning your script into a key visual, what should come first?","options":["Extract the most important, visible knowledge moment","Put every narration line into one image","Pick a trendy style first","Fill the image with lots of text"],"correct":0},{"type":"quiz","question":"2. Which set fully covers the five prompt parts for a key visual?","options":["Title, author, date, link, rating","Subject, scene, composition, style, constraints","Character, dialogue, music, subtitles, transitions","Colors, size, filename, score, version"],"correct":1},{"type":"quiz","question":"3. “The Moon is centered and fills about half the frame; the Sun is upper-right” mainly describes what?","options":["Subject","Knowledge fact","Composition","Constraint"],"correct":2},{"type":"quiz","question":"4. What is the most important acceptance standard for a knowledge key visual?","options":["Maximum decorative elements","At first glance, the core knowledge relation is clear and fact-consistent","Very bright colors only","Looks like a popular movie"],"correct":1},{"type":"quiz","question":"5. Generated text appears as gibberish. What is the safer fix?","options":["Keep it and explain it away","Set image to no text and add title in post-editing","Add even more text prompts","Treat gibberish as a scientific symbol"],"correct":1},{"type":"quiz","question":"6. Prompt says “in the style of a living artist.” Better revision?","options":["Keep the name and add “original”","Switch to another artist name","Describe visible style traits instead, such as clean science illustration, paper grain, soft side light","Only write “premium feel”"],"correct":2},{"type":"fill","question":"7. The first thing in a prompt is the core ___.","parts":["The first thing to define is the core","___","."],"options":["subject","filename","rating"],"correct":"subject"},{"type":"fill","question":"8. “Subject centered, leave title space in upper-right” describes ___.","parts":["This sentence describes","___","."],"options":["composition","constraints","source"],"correct":"composition"},{"type":"fill","question":"9. “No text, no logo, no extra planets” belongs to prompt ___.","parts":["These belong to prompt","___","."],"options":["constraints","scene","subject"],"correct":"constraints"},{"type":"quiz","question":"10. D1 script says “The Moon reflects sunlight.” Which visual is most accurate?","options":["The Moon emits light beams by itself","Sunlight points to the Moon, with a clearly lit side and clear relation","Put many unrelated planets around the Moon"],"correct":1},{"type":"practice","task":"11. [Knowledge Key Visual] Pick one core moment from your D1 15-30-second script. Write a full prompt with subject, scene, composition, style, and constraints. Then generate or plan one image and evaluate it on four checks: knowledge accuracy, clear subject, crop safety, and no extra text/logo.","rubric":"Prompt must include all five parts and stay consistent with D1 facts. Evaluation must comment on all four checks. The image should work as a key visual without relying on tiny in-image text.","placeholder":"Core script line: ...\nSubject: ...\nScene: ...\nComposition: ...\nStyle: ...\nConstraints: ...\nEvaluation: knowledge accuracy ...; subject clarity ...; crop safety ...; no extra text/logo ...","minLength":90,"referenceAnswer":"Core script line: The Moon does not emit light; we see reflected sunlight. Subject: Moon lit by sunlight. Scene: simple deep-space background with distant Sun. Composition: Moon centered at half-frame, Sun upper-right, clear light direction, title-safe area upper-left. Style: clear science illustration for teens, blue-gray lunar texture, soft lighting. Constraints: no text, no logo, no extra planets, Moon must not glow by itself. Evaluation: relation is accurate; subject is clear; works in vertical and horizontal crops; no extra text/logo."},{"type":"match","question":"12. Match: five-part prompt","pairs":[{"left":"The Moon lit by sunlight","right":"Subject"},{"left":"Simple deep-space background","right":"Scene"},{"left":"Moon centered, upper-left negative space","right":"Composition"},{"left":"Clean science illustration, soft light","right":"Style"}]},{"type":"match","question":"13. Match: script to image","pairs":[{"left":"Find the single most important sentence","right":"Set knowledge core"},{"left":"Turn causal relation into visible elements","right":"Design visual relation"},{"left":"Decide what the eye sees first","right":"Arrange visual hierarchy"},{"left":"Check against source facts","right":"Verify factual accuracy"}]},{"type":"match","question":"14. Match: common issues and fixes","pairs":[{"left":"Subject appears too small","right":"Increase subject proportion and simplify background"},{"left":"Light direction contradicts the science","right":"Specify light source and lit side clearly"},{"left":"Generated text is garbled","right":"Switch to no text and add typography later"},{"left":"Background steals attention","right":"Reduce irrelevant objects and high-contrast details"}]},{"type":"match","question":"15. Match: key visual acceptance checks","pairs":[{"left":"Image relation matches the script","right":"Knowledge accuracy"},{"left":"Still clear when thumbnail-sized","right":"Subject clarity"},{"left":"Safe area works in both aspect ratios","right":"Crop readiness"},{"left":"No gibberish, signature, or brand mark","right":"Constraint met"}]},{"type":"theory","content":"🏁 **Wrap-up | Key Visual Complete**\nSave your D1 core sentence, five-part prompt, key visual, and four acceptance results. This becomes the visual anchor for tomorrow's continuous shots."}]}},{"week":3,"data":{"day":4,"title":"Image Control: Positive/Negative Prompts, Reference Images, Local Edits, Version Consistency","shards":30,"steps":[{"type":"theory","content":"🎬 **Opening | Four Tools for Controlled Generation**\nToday we focus on positive prompts, negative prompts, reference images, and local editing (inpaint/outpaint). Goal: change what you need, keep what you do not want to move."},{"type":"video","url":"","content":"Video placeholder: build continuous shots using visual anchors, reference images, and version logs"},{"type":"theory","content":"⚓ **Theory Card 1 | Positive + Negative Prompt Teamwork**\nPositive prompts define what you want. Negative prompts explicitly block artifacts, gibberish text, and wrong style. Together they are more stable than piling up positive words only."},{"type":"theory","content":"🖼️ **Theory Card 2 | Reference Images and Local Editing**\nReference images help lock identity and style. Local edits change only selected regions, avoiding full redraw drift."},{"type":"theory","content":"🔬 **Theory Card 3 | Version Consistency**\nTrack local edit range in V1/V2/V3 logs. Check identity consistency, light direction, and knowledge relation every time."},{"type":"quiz","question":"1. If the subject changes across continuous shots, what should you add first?","options":["More unrelated background","Stable repeatable visual anchors","A longer story title","A completely different style per frame"],"correct":1},{"type":"quiz","question":"2. Which group is best as visual anchors?","options":["Beautiful, mysterious, epic","Blue-gray lunar surface, three craters at lower-right, thin white rim light","Cinematic, blockbuster, premium","Roughly similar to previous frame"],"correct":1},{"type":"quiz","question":"3. Main role of a reference image in continuous shots?","options":["Prove generated content is always true","Help keep subject shape, color, and style close","Automatically fix all knowledge errors","Replace storyboard and prompt"],"correct":1},{"type":"quiz","question":"4. Why use “change one thing at a time”?","options":["You can only generate one image each time","You can tell which edit caused the result","You no longer need to save older versions","It guarantees 100% identity consistency"],"correct":1},{"type":"quiz","question":"5. Shot 2 only needs a framing change. How should the prompt be written?","options":["Change color, scene, subject, and style together","Keep all anchors and only change wide shot to close-up","Remove reference image and anchors","Rewrite an unrelated topic"],"correct":1},{"type":"quiz","question":"6. Subject stays consistent but knowledge relation is wrong in shot 2. What should you do?","options":["Keep it if it looks good","Log the issue and only fix the wrong knowledge relation","Change shot 1 to match the mistake","Cover the visual error with subtitles"],"correct":1},{"type":"fill","question":"7. Repeated color, shape, and marks across shots are visual ___.","parts":["These stable features are visual","___","."],"options":["anchors","filters","transitions"],"correct":"anchors"},{"type":"fill","question":"8. To know which edit worked, each version changes one ___.","parts":["Each version changes one","___","."],"options":["variable","folder","story"],"correct":"variable"},{"type":"fill","question":"9. The table that stores version number, edits, and outcomes is a version ___.","parts":["This table is a version","___","."],"options":["log","cover","subtitle"],"correct":"log"},{"type":"quiz","question":"10. Which version log is most reproducible?","options":["Shot 2 looks better","V2: changed only wide shot to close-up; anchors unchanged; crater positions stable, lighting slightly cooler","Tried again and it felt good"],"correct":1},{"type":"practice","task":"11. [Continuous Shot Experiment] Based on your D3 key visual, produce at least 2 continuous frames for a 15-30-second story. First define 3-5 visual anchors and use your D3 key visual as reference. In Shot 2, change only one variable. Submit shot notes and complete V1/V2 version logs.","rubric":"Must include at least two continuous frames; list three to five concrete visible anchors; identify the reference image; Shot 2 changes only one variable; version log includes version id, preserved items, single change, result, and next step. Subject, style, and knowledge relation should stay consistent.","placeholder":"Visual anchors: 1. ... 2. ... 3. ...\nReference image: D3 key visual\nShot 1: ...\nShot 2: ...\nSingle change: ...\nV1 log: preserved ...; result ...\nV2 log: preserved ...; changed ...; result ...; next step ...","minLength":110,"referenceAnswer":"Visual anchors: blue-gray lunar surface; three craters at lower-right; Sun always upper-right; lit side facing right; clean science-illustration style. Reference image: D3 key visual. Shot 1: wide shot showing sunlight hitting the Moon. Shot 2: close-up of light-shadow boundary. Single change: framing from wide to close-up. V1: all anchors preserved, relation clear. V2: color/craters/light direction/style preserved, only framing changed; subject mostly consistent, craters shifted slightly left; next version only fixes crater position."},{"type":"match","question":"12. Match: consistency materials","pairs":[{"left":"Blue-gray lunar surface","right":"Color anchor"},{"left":"Three craters at lower-right","right":"Shape and position anchor"},{"left":"D3 key visual","right":"Reference image"},{"left":"Clean science illustration","right":"Style anchor"}]},{"type":"match","question":"13. Match: one-change rule","pairs":[{"left":"Wide shot to close-up; all else unchanged","right":"Single variable: framing"},{"left":"Day scene to night scene; all else unchanged","right":"Single variable: time mood"},{"left":"Subject, scene, and style all changed together","right":"Cannot isolate cause of change"},{"left":"Keep old prompt and outputs per version","right":"Easy to compare and roll back"}]},{"type":"match","question":"14. Match: drift issues and fixes","pairs":[{"left":"Subject color turns green","right":"Reinforce color anchors"},{"left":"Signature craters disappear","right":"Strengthen shape and position anchors"},{"left":"Style suddenly becomes photoreal","right":"Fix style wording and reference image"},{"left":"Light source flips to left side","right":"Restore light direction and science relation"}]},{"type":"match","question":"15. Match: version log fields","pairs":[{"left":"V1, V2","right":"Version ID"},{"left":"Color, shape, style unchanged","right":"Preserved items"},{"left":"Only changed wide shot to close-up","right":"Single change"},{"left":"Crater shifted; next version fixes position","right":"Result and next step"}]},{"type":"theory","content":"🏁 **Wrap-up | Continuous Shot Pack Complete**\nYour project box should now include a D3 reference image, 3-5 visual anchors, at least two continuous shot frames, and V1/V2 logs. Together they form a stable visual segment for your knowledge short."}]}},{"week":3,"data":{"day":5,"title":"Video Mechanics: Keyframes, Inter-Frame Generation, Temporal Consistency","shards":30,"steps":[{"type":"theory","content":"🎞️ **First Try | Keyframes to Continuous Frames**\nVideo generation can be viewed as keyframe conditioning plus in-between frame transition. Today we focus on keeping character identity, props, and lighting consistent over time."},{"type":"video","url":"","content":"Video: from static key visual to a rough 2-3-shot video sequence"},{"type":"theory","content":"🧭 **Card 1 | Keyframe Design**\nDefine start pose, end pose, and key prop positions for each shot. Clear keyframes reduce drift during interpolation."},{"type":"theory","content":"⏱️ **Card 2 | Inter-Frame Consistency**\nAdjacent frames should preserve identity anchors and motion continuity. Avoid “frame A is one character, frame B becomes another.”"},{"type":"theory","content":"📐 **Card 3 | Temporal Consistency Check**\nCheck three things: continuous character appearance, continuous prop trajectory, and continuous causal order. If frame jumps appear, reset keyframes."},{"type":"quiz","question":"1. Before image-to-video generation, what should you decide first?","options":["Add all actions at once","One key message for this shot","Set duration to the maximum first","Choose aspect ratio randomly"],"correct":1},{"type":"quiz","question":"2. Which motion prompt is the clearest?","options":["Make it more cinematic","Character runs, jumps, turns, waves, with explosion in background","Camera slowly pushes in while the character looks up at a star map","Make everything move"],"correct":2},{"type":"quiz","question":"3. What do we call a camera that slowly moves toward the subject?","options":["Push-in","Pull-out","Side-pan","Top-down shot"],"correct":0},{"type":"quiz","question":"4. Why should one shot avoid too many actions?","options":["Fewer actions always make smaller files","The model may confuse action order and cause deformation","Shots can only contain still characters","Narration cannot describe actions"],"correct":1},{"type":"quiz","question":"5. Common aspect ratio for vertical knowledge shorts?","options":["9:16","16:9","1:1","21:9"],"correct":0},{"type":"quiz","question":"6. For a 3-shot plan, which approach is better?","options":["Repeat the same action in all three shots","Give each shot one narrative role with clear duration","Use push, pull, and pan all at once in every shot","Write visuals only, no motion notes"],"correct":1},{"type":"fill","question":"7. Text describing how the camera moves is camera ___.","parts":["Text describing camera movement is camera","___","."],"options":["motion","narration","source"],"correct":"motion"},{"type":"fill","question":"8. Looking up, flipping pages, or pointing at a star map are subject ___.","parts":["These are subject","___","."],"options":["actions","aspect ratio","duration"],"correct":"actions"},{"type":"fill","question":"9. 9:16 and 16:9 represent video ___.","parts":["9:16 and 16:9 represent video","___","."],"options":["aspect ratio","frame rate","volume"],"correct":"aspect ratio"},{"type":"quiz","question":"10. A 5-second shot asks for run, jump, turn, take a book, and speak. Best fix?","options":["Split into multiple shots, one major action per shot","Write a longer prompt but keep one shot","Cut to 2 seconds so action is faster","Add an orbit camera for impact"],"correct":0},{"type":"practice","task":"11. [Shot Motion Sheet] Design 2-3 shots for one knowledge story. For each shot, write visual focus, camera motion, subject action, duration, and aspect ratio. Limit each shot to one main action.","rubric":"Must include 2-3 continuous shots; each shot needs full fields: visual focus, camera motion, subject action, duration, aspect ratio. Actions should fit the allocated time and avoid overstuffing.","placeholder":"Shot 1 | Visual: ... | Camera motion: ... | Subject action: ... | Duration: ... sec | Aspect ratio: ...\nShot 2 | ...","minLength":90,"referenceAnswer":"Shot 1 | Wide shot of night library | Slow push-in | Little dragon looks up at star map | 4s | 9:16. Shot 2 | Close-up of evidence card | Gentle side-pan | Dragon points to “Moon reflects sunlight” | 5s | 9:16. Shot 3 | Mid shot for wrap-up | Slow pull-out | Dragon puts card into project box | 4s | 9:16."},{"type":"match","question":"12. Match: camera motions","pairs":[{"left":"Camera gradually moves toward subject","right":"Push-in"},{"left":"Camera gradually moves away from subject","right":"Pull-out"},{"left":"Camera moves horizontally with subject","right":"Side-pan"},{"left":"Camera does not move","right":"Static shot"}]},{"type":"match","question":"13. Match: actions and shot purpose","pairs":[{"left":"Dragon looks up at star map","right":"Shows discovery"},{"left":"Claw points to source sentence","right":"Highlights evidence"},{"left":"Card goes into project box","right":"Shows completion"},{"left":"Background clouds drift slowly","right":"Adds light environmental motion"}]},{"type":"match","question":"14. Match: duration and content","pairs":[{"left":"3 seconds","right":"One simple look-up action"},{"left":"5 seconds","right":"Show and point to one evidence line"},{"left":"Action cannot finish in time","right":"Extend duration or reduce actions"},{"left":"Shot lingers too long","right":"Shorten duration or add reasonable change"}]},{"type":"match","question":"15. Match: issues and fixes","pairs":[{"left":"Character limbs deform visibly","right":"Reduce complex motion and regenerate"},{"left":"Camera shake hurts readability","right":"Use static or slower camera motion"},{"left":"Horizontal asset for vertical platform","right":"Re-plan 9:16 composition"},{"left":"Three shots have no narrative link","right":"Reorder as discover, verify, conclude"}]},{"type":"theory","content":"✅ **Store in Your Project Box**\nSave your 2-3-shot rough video and motion sheet. Tomorrow you add narration, subtitles, and music to complete a publish-ready 15-30-second short."}]}},{"week":3,"data":{"day":6,"title":"Audio Pipeline: TTS, ASR, Subtitle Sync, Copyright, Privacy","shards":30,"steps":[{"type":"theory","content":"🎙️ **First Try | Voice + Subtitle Dual Channel**\nToday we lock three layers: TTS narration generation, ASR back-check, and subtitle timeline sync, then add copyright and privacy checks."},{"type":"video","url":"","content":"Video: add narration, subtitles, and music to your 15-30-second short, then complete release checks"},{"type":"theory","content":"🎧 **Card 1 | TTS-ASR Loop**\nTTS creates understandable narration. ASR listens back to catch wrong words, missing words, and misread terms."},{"type":"theory","content":"✂️ **Card 2 | Subtitle and Audio-Visual Sync**\nSubtitles must match words, timing, and visual information points. Avoid “voice ends, subtitle appears later.”"},{"type":"theory","content":"🛡️ **Card 3 | Copyright and Privacy**\nCheck licenses for music, voice timbre, images, and fonts. Narration/subtitles must not expose personal information. AI-generated content should be clearly labeled."},{"type":"quiz","question":"1. For a 15-30-second short, what should narration satisfy first?","options":["Pack in all source details","Be naturally readable within the target duration","Speak at least ten words per second","Use advanced jargon only"],"correct":1},{"type":"quiz","question":"2. What is the most basic subtitle requirement?","options":["Match narration content and timing","Longer lines always look more professional","Use many animated fonts","Show title only"],"correct":0},{"type":"quiz","question":"3. With narration present, music should usually be...","options":["Louder than voice","Fully cover environmental sound","Lower volume so voice stays clear","A new song in every shot"],"correct":2},{"type":"quiz","question":"4. When narration says “The Moon reflects sunlight,” the best visual support is...","options":["An unrelated volcano scene","A scene showing Moon-sunlight relation or matching evidence","Fast flashing effects only","A blank frame"],"correct":1},{"type":"quiz","question":"5. Which editing rhythm fits a knowledge short better?","options":["Cut away immediately when key info appears","Every shot has identical length","Give viewers enough time to read key info, then cut","The more fragmented the shots, the better"],"correct":2},{"type":"quiz","question":"6. When publishing AI-assisted videos, you should...","options":["Hide AI involvement","Disclose AI-generated/assisted parts and keep fact sources","Label AI visuals as live footage","Only write “for reference”"],"correct":1},{"type":"fill","question":"7. When visuals and narration line up, that is audio-visual ___.","parts":["When visuals and narration line up, that is audio-visual","___","."],"options":["sync","mixing","transition"],"correct":"sync"},{"type":"fill","question":"8. To keep voice clear, background music ___ should stay below narration.","parts":["Background music","___","should stay below narration."],"options":["volume","speed","duration"],"correct":"volume"},{"type":"fill","question":"9. The checklist that verifies facts, copyright, and privacy is a release check ___.","parts":["This checklist is a release check","___","."],"options":["sheet","script","shot"],"correct":"sheet"},{"type":"quiz","question":"10. Rough cut is 24s, but natural narration needs 36s. Best fix?","options":["Cut secondary lines and re-record, then adjust shot timing if needed","Speed up voice until hard to understand","Use subtitles for second half without timing changes","Keep it and explain after publishing"],"correct":0},{"type":"practice","task":"11. [15-30s Rough Cut + Checklist] Design one rough cut with total duration, per-shot timing, narration, subtitles, and music treatment. Then list release checks for facts, copyright, privacy, and AI disclosure.","rubric":"Total length must be 15-30 seconds. Shot timing should be continuous and narration naturally readable. Subtitles must match narration. Music cannot mask voice. Checklist must cover fact source, media rights, personal privacy, and AI generated/assisted disclosure.","placeholder":"Total length: ... sec\n0-... sec | Visual: ... | Narration: ... | Subtitles: ... | Music: ...\nRelease checks: facts ...; copyright ...; privacy ...; AI disclosure ...","minLength":130,"referenceAnswer":"Total length: 22 seconds. 0-6s: dragon looks at the Moon; narration asks “Why does the Moon look bright?” subtitle synced; soft music. 6-15s: close-up of source card; narration says “The Moon does not emit light, it reflects sunlight”; subtitles in two lines; music lowered under voice. 15-22s: dragon presents conclusion and source; narration cites public planetarium source; subtitle shows source short name. Checks: facts verified in source; music/image licenses valid; no personal info; AI-assisted visual label in ending frame."},{"type":"match","question":"12. Match: audio issues and fixes","pairs":[{"left":"Music covers narration","right":"Lower music volume"},{"left":"Narration has clipping","right":"Adjust mic distance and re-record"},{"left":"No pause between sentences","right":"Edit natural breathing space"},{"left":"Voice volume jumps between lines","right":"Normalize narration loudness"}]},{"type":"match","question":"13. Match: subtitle checks","pairs":[{"left":"Subtitle appears before narration","right":"Shift subtitle later"},{"left":"One line is too long","right":"Split by meaning or shorten text"},{"left":"Subtitle blocks key evidence","right":"Change subtitle position or composition"},{"left":"Technical term is misspelled","right":"Correct against reliable source"}]},{"type":"match","question":"14. Match: release risks","pairs":[{"left":"Using unlicensed popular music","right":"Replace with licensed track"},{"left":"Classmate name appears on screen","right":"Remove it or get explicit consent"},{"left":"Scientific number has no source","right":"Verify source before use"},{"left":"AI visual resembles real news footage","right":"Clearly label it as AI-generated"}]},{"type":"match","question":"15. Match: editing rhythm","pairs":[{"left":"First 3 seconds","right":"Raise the main question quickly"},{"left":"Middle section","right":"Show evidence and explanation"},{"left":"Ending section","right":"Conclude and give source"},{"left":"Key subtitle too short to read","right":"Hold longer or simplify text"}]},{"type":"theory","content":"✅ **Store in Your Project Box**\nSave your 15-30-second rough cut and completed release checklist. Tomorrow's Boss requires a fully edited final film with complete narration/subtitles and passed checks."}]}},{"week":3,"data":{"day":7,"title":"Boss Dragon on Screen: Final Film + Mechanism Notes + Fix Log + Release Checks","shards":60,"isBoss":true,"steps":[{"type":"theory","content":"🐉 **Boss Kickoff | Four Required Deliverables**\nToday you must submit: a 15-30-second final film, key mechanism notes (image understanding / image generation / video / audio pipelines), a fix log, and a release checklist. Text-image stories or prototypes do not count as complete."},{"type":"video","url":"","content":"Video: from reliable script to a finished 15-30-second knowledge short film"},{"type":"theory","content":"📚 **Card 1 | Explain Mechanisms Clearly**\nAt minimum, explain: how the visual encoder reads images, how diffusion generates images, how keyframes form video, and how TTS/ASR validate audio."},{"type":"theory","content":"🎬 **Card 2 | Fix Log**\nRecord at least two fixes: symptom, diagnosed cause, parameter/prompt adjustment, and final result. Make your process traceable."},{"type":"theory","content":"✅ **Card 3 | Final Release Gate**\nFinal film, factual sources, licensing, privacy, and AI disclosure must all pass. If any one fails, revise before release."},{"type":"quiz","question":"1. In Week 3 Boss, what is the only valid final deliverable?","options":["A text-and-image story","A storyboard prototype only","A finished 15-30-second knowledge short film","A set of unedited generated clips"],"correct":2},{"type":"quiz","question":"2. How should factual claims in your Boss script be handled?","options":["Each claim can be traced to reliable sources with citation records","Let AI auto-complete facts","Keep anything that sounds plausible","Use disclaimer instead of citation"],"correct":0},{"type":"quiz","question":"3. What does “continuous shots” mean?","options":["All shots use the same framing","Character, props, actions, and story connect across shots","Every shot uses the same camera motion","Put three unrelated clips together"],"correct":1},{"type":"quiz","question":"4. Which audio element is required in a complete final film?","options":["Background music only","Auto subtitles only","Clear narration with synced subtitles","Narration text file without recording"],"correct":2},{"type":"quiz","question":"5. When publishing AI-generated visuals, release notes should include...","options":["Only the project title","AI generated/assisted disclosure plus asset usage status","Hide the production process","Label generated visuals as real filming"],"correct":1},{"type":"quiz","question":"6. For a 20-second final film, what best proves the knowledge is communicated clearly?","options":["Many transitions","Viewers can state the core fact and find its source","Popular background music","Complex motion in every shot"],"correct":1},{"type":"fill","question":"7. Boss final duration must be between 15 and ___ seconds.","parts":["Boss final duration must be between 15 and","___","seconds."],"options":["30","45","60"],"correct":"30"},{"type":"fill","question":"8. Text that appears in sync with narration is called ___.","parts":["Text appearing in sync with narration is called","___","."],"options":["subtitles","script","sources"],"correct":"subtitles"},{"type":"fill","question":"9. Results for fact, copyright, privacy, and AI disclosure checks must go into the release check ___.","parts":["These results must be written in the release check","___","."],"options":["record","shot","prompt"],"correct":"record"},{"type":"quiz","question":"10. You have script, key visual, and storyboard, but no exported video. Boss verdict?","options":["Not qualified. You must finish narration, subtitles, editing, and export a 15-30-second final film","Qualified. Script can replace final film","Qualified. Key visual counts as the final story","Only verbal explanation is needed"],"correct":0},{"type":"practice","task":"11. [Boss Final Delivery Sheet] Write your final delivery record for the 15-30-second knowledge film: title and core fact, script and sources, key visual note, 2-3 continuous shots, narration/subtitle status, final duration and file, plus release check results.","rubric":"Must explicitly deliver a playable 15-30-second final film. Text-image story, script only, storyboard only, or prototype only are not accepted. Record must fully cover script/sources, key visual, continuous shots, narration/subtitles, final file, and release checks for facts/copyright/privacy/AI labeling.","placeholder":"Title: ... | Core fact: ... | Source: ...\nKey visual: ...\nContinuous shots: 1. ... 2. ... 3. ...\nNarration/subtitles: ... | Final film: ... sec, file ...\nRelease checks: facts ...; copyright ...; privacy ...; AI labeling ...","minLength":170,"referenceAnswer":"Title: “Borrowed Moonlight.” Core fact: the Moon does not emit light; it mainly reflects sunlight. Script is based on a public planetarium source with page title, institution, and access date. Key visual shows the dragon observing the Moon and is labeled AI-assisted. Shot 1 raises the question, Shot 2 presents sunlight-to-Moon evidence, Shot 3 concludes with source, with consistent character/props continuity. Narration is clear and subtitles are synced. Exported final MP4 is 22 seconds. Release checks confirm fact traceability, licensed audio/images, no personal privacy leakage, and end-card AI disclosure."},{"type":"match","question":"12. Match: Boss deliverables","pairs":[{"left":"Script and sources","right":"Prove knowledge is verifiable"},{"left":"Key visual and continuous shots","right":"Build a coherent visual story"},{"left":"Narration and subtitles","right":"Make content hearable and readable"},{"left":"15-30-second final film","right":"Final playable output file"}]},{"type":"match","question":"13. Match: continuity checks","pairs":[{"left":"Backpack color suddenly changes","right":"Unify character anchors"},{"left":"Shot 1 shows card in hand, Shot 2 card disappears","right":"Fix prop continuity"},{"left":"Character exits right but enters next shot from right","right":"Correct motion direction"},{"left":"Story jumps from discovery to conclusion","right":"Insert verification shot"}]},{"type":"match","question":"14. Match: unqualified delivery and fix","pairs":[{"left":"Only a text-image story","right":"Add narration/subtitles and edit into video"},{"left":"Only storyboard prototype","right":"Complete continuous shots and export final"},{"left":"Final film is 42 seconds","right":"Trim to 15-30 seconds"},{"left":"Video has no source info","right":"Add source verification record and source end-card"}]},{"type":"match","question":"15. Match: release checklist records","pairs":[{"left":"Fact check","right":"Map each claim to a reliable source"},{"left":"Copyright check","right":"Confirm music, images, and fonts are usable"},{"left":"Privacy check","right":"Remove personal data without consent"},{"left":"AI check","right":"Label generated or assisted parts clearly"}]},{"type":"theory","content":"🏆 **Week 3 Completed**\nYou have combined reliable sources, original key visuals, continuous shots, narration/subtitles, and release responsibility into one 15-30-second knowledge film. Completion is not “AI generated it.” Completion is playable output, traceable facts, usable assets, and clear audience understanding."}]}},{"week":4,"data":{"day":1,"title":"Summon Clone Skills: Chat / Workflow / Agent","shards":30,"steps":[{"type":"theory","content":"🐉 **Three Layers: Chat, Workflow, Agent**\n\nChat handles one-turn Q&A. Workflow automates fixed sequences. Agent works in uncertain situations with plan-execute-correct loops. Core chain: **Goal → Plan → Tool → Act → Check → Update or Stop**."},{"type":"video","url":"","content":"Video: today's concept and safe operation demo"},{"type":"theory","content":"💬 **Theory Card | Watch the action chain**\nA chatbot is great for explaining one concept or polishing one sentence. An Agent is better for tasks like \"prepare this week's astronomy club checklist\": it plans research, organizes data, and verifies details step by step."},{"type":"theory","content":"🧭 **Theory Card | Clear goals first**\n\"Help me make this better\" is not a goal. Better: \"Write a 150-word draft for Friday's stargazing event, include 3 observation targets with sources, draft only, no sending.\""},{"type":"theory","content":"🛡️ **Theory Card | Safety red lines**\nDo not collect sensitive data like home addresses, ID numbers, contact details, exact location, or passwords. Payments, sending, deleting, and publishing must require human confirmation."},{"type":"theory","content":"🔍 **Theory Card | Reliability means checking**\nWhen sources conflict, evidence is missing, or a request goes out of scope, the Agent should check, revise the plan, or stop and report."},{"type":"quiz","question":"1. What is the most reliable sign that a helper is acting as an Agent?","options":["It can generate very long answers in one try.","It remembers one previous chat turn.","It can plan steps around a goal, use allowed tools, and check results.","It has web search enabled."],"correct":2},{"type":"quiz","question":"2. Your stargazing club needs materials for Friday. Which setup best fits a controlled Agent?","options":["Let it collect as much as possible from the open web first.","Let it extract targets from two approved public sources and draft a note.","Let it draft, choose audience, and auto-send before deadline.","Let it rewrite last week's content without checking this week's sources."],"correct":1},{"type":"quiz","question":"3. The Agent finished a poster draft and suggests \"publish now\". What should happen next?","options":["Let it decide by predicted clicks.","Generate 3 versions and let it publish the most attractive one.","Auto-schedule posting once no personal data is visible.","A human reviews content, image rights, and audience, then decides."],"correct":3},{"type":"quiz","question":"4. Which is a clear, testable Agent goal?","options":["Create an attractive event plan and fill missing info on your own.","Collect all astronomy news this month and pick the most valuable.","Use two public astronomy sources to write a 150-word reminder draft with citations.","Choose event time, budget, and participant list based on preferences."],"correct":2},{"type":"quiz","question":"5. The Agent finds telescope accessories in three shops. What is the safest design?","options":["Compare price/spec/return policy and output recommendations; human confirms payment.","Auto-order if price is inside budget, then leave a log for review.","Collect all participants' addresses first for shipping sort.","Watch prices continuously and auto-buy below threshold."],"correct":0},{"type":"quiz","question":"6. Two trusted pages disagree on meteor shower peak date. What should the Agent do?","options":["Choose the newest page and hide the difference.","Mark the conflict, check date and region scope, then report and stop if unresolved.","Write both dates and leave readers to decide.","Keep searching until all pages agree exactly."],"correct":1},{"type":"fill","question":"7. In the core action model, after checking, the system should \"update or ___\".","parts":["Fill in:","___","."],"options":["stop","expand tools","store memory"],"correct":"stop"},{"type":"fill","question":"8. Before approval, the best output for a club announcement is a ___ .","parts":["Fill in:","___","."],"options":["reviewable draft","already sent notice","public link"],"correct":"reviewable draft"},{"type":"fill","question":"9. Listing which websites/files/functions are allowed ahead of time is setting a tool ___ .","parts":["Fill in:","___","."],"options":["whitelist","priority","version log"],"correct":"whitelist"},{"type":"quiz","question":"10. A draft needs members' city but not street address. How should the Agent collect data?","options":["Ask only for city needed for the task and explain why.","Also ask for addresses in case future features need them.","Infer exact location from profile photos."],"correct":0},{"type":"practice","task":"11. [Controlled action chain] For a stargazing reminder, write: goal, two allowed source types, one checkpoint, and stop point. Agent can draft only, not send.","rubric":"Must include a testable goal, two source types, at least one checkpoint, a draft-only stop point, and a no-send boundary. No real private data.","placeholder":"Goal: ...\nAllowed sources: ...\nCheckpoint: ...\nStop point: ...","minLength":45,"referenceAnswer":"Goal: Write a 120-word stargazing reminder draft. Allowed sources: astronomy center public page and school event notice. Checkpoint: verify date, location, and citations. Stop point: stop after draft and wait for organizer approval."},{"type":"match","question":"12. Match each scenario with the best helper mode:","pairs":[{"left":"Explain \"apparent magnitude\" and improve one promo sentence","right":"Single-turn support from a chatbot"},{"left":"Organize two sources, cite them, and draft an event note","right":"Multi-step task for a controlled Agent"},{"left":"Decide whether to post the poster publicly","right":"Human confirmation"},{"left":"Source dates conflict","right":"Check, then update or stop"}]},{"type":"match","question":"13. Match each goal style with likely result:","pairs":[{"left":"\"Write a 150-word draft with two sources, do not send\"","right":"Scope and stop point are testable"},{"left":"\"Make the event as great as possible\"","right":"Criteria are vague and hard to check"},{"left":"\"Decide yourself who should receive it\"","right":"Crosses human decision boundaries"},{"left":"\"If no reliable source is found, report it\"","right":"Defines an exit path for failure"}]},{"type":"match","question":"14. Match each permission request with proper handling:","pairs":[{"left":"Read public astronomy pages to draft a reminder","right":"Allow within limited scope"},{"left":"Access full class contact list to draft text","right":"Reject unrelated permission"},{"left":"Complete payment while comparing prices","right":"Reserve for human confirmation"},{"left":"Delete original sources while cleaning drafts","right":"List candidates and wait for confirmation"}]},{"type":"match","question":"15. Match each execution signal with the best next action:","pairs":[{"left":"Draft has conclusions but no citations","right":"Add citations before acceptance"},{"left":"Output exceeds required length","right":"Revise to constraints and re-check"},{"left":"Needs home address to continue","right":"Stop and do not collect that data"},{"left":"All acceptance checks are satisfied","right":"Stop and hand over for human review"}]},{"type":"theory","content":"✅ **Wrap-up**\nRemember: **Goal → Plan → Tool → Act → Check → Update or Stop**. Payments, sending, deleting, and publishing always require human confirmation."}]}},{"week":4,"data":{"day":2,"title":"Summon Clone Skills: Goal / Plan / Task / State / Done","shards":30,"steps":[{"type":"theory","content":"Stateful Task Scroll\n\nUse a five-part structure today: Goal, Plan, Task, State, Done. The core model stays the same: Goal -> Plan -> Tool -> Act -> Check -> Update or Stop."},{"type":"video","url":"","content":"Video: concept walkthrough and safe-operation demo"},{"type":"theory","content":"Theory Card: Six-Slot Task Scroll\nWrite down: final deliverable, target audience, scope and format, allowed sources, forbidden actions, and stop condition. Example: create a five-book sci-fi list for a grade-7 reading club, include verifiable library sources, draft only."},{"type":"theory","content":"Theory Card: Break Big Work into Small Steps\n\"Run a reading event\" can be decomposed into: confirm theme -> check approved sources -> choose books -> validate age suitability and citations -> create draft. Each step should produce a checkable output."},{"type":"theory","content":"Theory Card: Stop Conditions Are Brakes\nGood examples: stop after three reliable sources, retry at most two times, stop after draft and wait for approval. Before contacting others, publishing, or processing personal data, stop first."},{"type":"theory","content":"Theory Card: Privacy Boundaries in Tasks\nDo not include sensitive data such as addresses, phone numbers, or account credentials. Never let an agent auto-pay, auto-send, auto-delete, or auto-publish; those are human decisions."},{"type":"quiz","question":"1. Which task scroll gives an agent the clearest execution path?","options":["Make a list for grade 7 and let the agent decide the details.","Find five sci-fi books; source links can be added later.","Draft a five-book sci-fi list for grade 7, each with a library or publisher source, output draft only.","Collect as many sci-fi books as possible and send to club members directly."],"correct":2},{"type":"quiz","question":"2. \"Confirm theme, then check catalog, then validate age fit\" mainly belongs to which stage?","options":["Plan: arranging checkable steps","Act: directly generating the final product","Tool: granting broader permissions","Stop: refusing all tasks"],"correct":0},{"type":"quiz","question":"3. For a public club poster, which stop condition is safest?","options":["After exploring three design styles, auto-publish the style predicted to win votes.","Stop at a reviewable draft and wait for owner approval before publish.","Keep revising until the agent believes there are no flaws, then auto-upload.","Collect more preferences and let the agent choose audience and schedule."],"correct":1},{"type":"quiz","question":"4. Which decomposition best helps you catch errors early?","options":["List candidates -> generate full list -> let readers find problems.","Search, write, and publish at the same time.","Sort search results and estimate age fit from short summaries.","Define audience -> check approved catalogs -> validate source and age fit -> draft."],"correct":3},{"type":"quiz","question":"5. The agent fails twice to find reliable publisher info for one title. What should happen?","options":["Fill the gap with data from a similar book.","Mark the missing evidence, stop, and ask a human for new sources or replacement.","Expand search to private accounts and personal chats.","Keep retrying until the answer looks believable."],"correct":1},{"type":"quiz","question":"6. Which input is not appropriate for a teen-safe task scroll?","options":["Target grade and expected length","Approved library catalogs","Participants home addresses and contact details","Rule to stop after draft for review"],"correct":2},{"type":"fill","question":"7. The slot that defines what final artifact to submit is ___.","parts":["Fill:","___","."],"options":["deliverable definition","tool checklist","retry record"],"correct":"deliverable definition"},{"type":"fill","question":"8. Turning a broad mission into checkable mini-steps is task ___.","parts":["Fill:","___","."],"options":["decomposition","authorization","archiving"],"correct":"decomposition"},{"type":"fill","question":"9. \"Report after two failed lookups\" is a ___ condition.","parts":["Fill:","___","."],"options":["stop","trigger","publish"],"correct":"stop"},{"type":"quiz","question":"10. A task says \"auto-send after draft.\" What is the key fix?","options":["Change to: stop at draft and let a human decide whether to send.","Keep auto-send but delay by ten minutes.","Let the agent judge safety by itself."],"correct":0},{"type":"practice","task":"11. Fix this task scroll: rewrite \"find some good books and send them\" so it includes audience, quantity, allowed sources, output format, acceptance checks, and stop condition.","rubric":"Answer should clearly include audience, quantity, allowed sources, draft format, checkable criteria, and a stop-before-send rule. No auto-send and no fabricated source data.","placeholder":"For...; quantity...; use only...; output...; checks...; when done...","minLength":55,"referenceAnswer":"For a grade-7 reading club, pick five sci-fi books from the school library catalog. Include author, summary, and source for each. Output a reviewable table. Check quantity, source validity, and age fit. Stop at draft and do not send."},{"type":"match","question":"12. Match each task-scroll field to its function:","pairs":[{"left":"\"Grade 7, five books, 150 words\"","right":"Sets audience, scope, and format limits"},{"left":"\"Use school library catalog only\"","right":"Limits allowed sources"},{"left":"\"Each book must include a source\"","right":"Defines a checkable quality standard"},{"left":"\"Stop after draft and wait for review\"","right":"Creates a stop and confirmation gate"}]},{"type":"match","question":"13. Match each symptom to the better decomposition fix:","pairs":[{"left":"Search starts before the theme is decided","right":"Confirm theme and audience first"},{"left":"Many candidates but incomplete citations","right":"Add a dedicated citation-check step"},{"left":"Writing is polished but not age-appropriate","right":"Add explicit age-suitability checks"},{"left":"Evidence is missing but output continues","right":"Set a stop condition for evidence gaps"}]},{"type":"match","question":"14. Match each request to the safer response:","pairs":[{"left":"\"Send the draft to everyone now\"","right":"Stop at draft and let the owner decide"},{"left":"\"Store student phone numbers for convenience\"","right":"Reject unrelated personal-data collection"},{"left":"\"If source is missing, still fill all five books\"","right":"Mark gaps or replace candidates"},{"left":"\"Keep trying until success\"","right":"Retry within limit, then stop"}]},{"type":"match","question":"15. Match each loop stage to the guiding question:","pairs":[{"left":"Goal","right":"Who is this for, and what is the deliverable?"},{"left":"Plan","right":"What order should steps follow?"},{"left":"Tool","right":"Which sources and functions are allowed?"},{"left":"Check","right":"Does output pass acceptance criteria?"}]},{"type":"theory","content":"Wrap-up\nKeep this loop in mind: Goal -> Plan -> Tool -> Act -> Check -> Update or Stop. Payment, sending, deletion, and publishing always require human confirmation."}]}},{"week":4,"data":{"day":3,"title":"Summon Clone Skills: Function Calling and Tool Schema","shards":30,"steps":[{"type":"theory","content":"Function Calling and Tool Contracts\n\nToday focuses on Function Calling, Tool Schema, parameter validation, structured returns, and handling permission failures. Tool calls are not guesses; they must follow contracts."},{"type":"video","url":"","content":"Video: concept walkthrough and safe-operation demo"},{"type":"theory","content":"Theory Card: Schema First\nBefore calling a tool, check required fields, value types, and allowed enum values. If parameters are missing or invalid, return a recoverable error instead of guessing."},{"type":"theory","content":"Theory Card: Reliable Sources\nPrioritize traceable public sources from libraries, museums, schools, and research institutions. Random reposts, unsourced short-video comments, and private screenshots are not reliable evidence."},{"type":"theory","content":"Theory Card: Least Privilege\nRead-only beats edit access; one folder beats full-device scope; temporary beats permanent. Having view access does not mean you can copy or publish content."},{"type":"theory","content":"Theory Card: Small Pilot Before Full Run\nTest on a small public sample first: are citations correct, are permission requests relevant, and does the agent stop at safety gates? Pass the pilot before full output."},{"type":"quiz","question":"1. Which tool set best follows least privilege for writing a campus plant card?","options":["Enable edit and delete permissions first for convenience.","Allow contacts, exact location, and payment tools.","Open all websites to avoid missing information.","Use approved plant references, public institution pages, and text editing only."],"correct":3},{"type":"quiz","question":"2. For a meteor-shower reminder, which source should be prioritized?","options":["Highly shared social posts","A personal blog with no cited source","A dated public page from an astronomy institution","Unsourced short-video commentary"],"correct":2},{"type":"quiz","question":"3. \"Read event folder only; no edits\" demonstrates what principle?","options":["Least privilege with task-limited read scope","Temporary full authorization","Permanent memory retention","Automatic execution optimization"],"correct":0},{"type":"quiz","question":"4. While organizing a book list, the agent requests contact access. Best response?","options":["Allow read-only contacts just in case.","Reject because contacts are unrelated to this task.","Allow access but ask not to save names.","Grant full-device access instead."],"correct":1},{"type":"quiz","question":"5. Before generating a final club artifact, what pilot test is most valuable?","options":["Run on full data immediately for realism.","Remove all limits to test maximum capability.","Use a small public sample to test citations, tool parameters, and stop behavior.","Publish once first to test reach."],"correct":2},{"type":"quiz","question":"6. If the agent can view teacher-provided material, can it publish it automatically?","options":["Yes, view permission also means publish permission.","No, publication still needs explicit authorization and human confirmation.","Yes, as long as the teacher is credited.","Yes, if the source came from school."],"correct":1},{"type":"fill","question":"7. Enabling only capabilities required by the current task is the ___ principle.","parts":["Fill:","___","."],"options":["minimization","generalization","automation"],"correct":"minimization"},{"type":"fill","question":"8. Access mode that allows viewing but no edits is ___ permission.","parts":["Fill:","___","."],"options":["read-only","collaborative edit","public share"],"correct":"read-only"},{"type":"fill","question":"9. Sources with traceable authors or institutions are ___ sources.","parts":["Fill:","___","."],"options":["reliable","popular","personal"],"correct":"reliable"},{"type":"quiz","question":"10. For one plant card, the agent asks to read your entire photo album. Best response?","options":["Reject full-album access; provide selected photos or public references only.","Grant temporary full album access and clean up later.","Allow access but ask the agent to ignore private photos."],"correct":0},{"type":"practice","task":"11. Minimal toolkit challenge: for a campus plant profile card, list up to 3 required tools or sources and 3 permissions that should stay disabled, each with one reason.","rubric":"Required items should directly support evidence-based drafting. Disabled permissions should include unrelated high-risk access such as contacts, payment, broad storage, or auto-publish.","placeholder":"Required: ...\nDisabled: ...\nReason: ...","minLength":50,"referenceAnswer":"Required: school plant records, public botanic garden pages, and a text editor. Disabled: contacts, exact location, and payment. Reason: these permissions are unrelated to drafting and increase privacy or misuse risk."},{"type":"match","question":"12. Match each task with a suitable minimal tool set:","pairs":[{"left":"Turn a library catalog into a draft reading list","right":"Catalog data plus text editor"},{"left":"Track anonymous signup count trends","right":"Anonymous table plus spreadsheet tools"},{"left":"Write a campus plant profile card","right":"Public nature sources plus text editor"},{"left":"Prepare a stargazing reminder","right":"Astronomy institution sources plus draft tool"}]},{"type":"match","question":"13. Match each source situation with proper handling:","pairs":[{"left":"Public library catalog","right":"Use it and preserve citations"},{"left":"Teacher-provided activity material","right":"Use only for the agreed purpose"},{"left":"Private chat screenshot","right":"Do not upload or use as evidence"},{"left":"Unsourced forwarded message","right":"Verify with independent reliable sources"}]},{"type":"match","question":"14. Match each permission pattern with risk control value:","pairs":[{"left":"Limit to one read-only folder","right":"Prevents accidental edits elsewhere"},{"left":"Revoke access after the event","right":"Avoids long-term permission retention"},{"left":"Do not connect contacts","right":"Avoids unrelated personal-data access"},{"left":"Disable payment tools","right":"Avoids unconfirmed spending"}]},{"type":"match","question":"15. Match each check finding with the correction action:","pairs":[{"left":"Citation link points to an unrelated page","right":"Replace or remove that evidence"},{"left":"Source requires private account login","right":"Stop and do not bypass access limits"},{"left":"Tool requests edit access to source files","right":"Switch to read-only or manual handling"},{"left":"Evidence is sufficient for draft","right":"Stop and hand over for review"}]},{"type":"theory","content":"Wrap-up\nFunction Calling is reliable only when Tool Schema is explicit, parameter validation is strict, permissions follow least privilege, and structured returns are checked before update or stop."}]}},{"week":4,"data":{"day":4,"title":"Summon Clone Skills: Plan-Act-Observe-Update Loop Control","shards":30,"steps":[{"type":"theory","content":"Plan-Act-Observe-Update Loop\n\nToday we run execution with the Plan-Act-Observe-Update cycle, plus context compression, duplicate detection, and a maximum-steps cap to prevent runaway loops."},{"type":"video","url":"","content":"Video: concept walkthrough a
