nd safe-operation demo"},{"type":"theory","content":"Theory Card: Checkpoints as Milestones\nIn a reading recommendation workflow, checkpoints can be: source reliability, age-fit and duplicate checks, then final format and length checks. Move forward only after a checkpoint passes."},{"type":"theory","content":"Theory Card: Safe Recovery in Three Moves\nLog where and why failure happened -> try one safe alternative -> re-check. If a link fails, use another approved institutional source. Do not use private data and never fabricate evidence."},{"type":"theory","content":"Theory Card: Bounded Retries\nExample: retry each source at most two times. If failures continue, data conflicts persist, sensitive fields are requested, or an external action is next, stop and report. Stopping is a safe success state."},{"type":"theory","content":"Theory Card: Brief Execution Logs\nRecord goal, sources used, completed steps, issues, retry counts, and stop reasons. Keep logs factual and free of sensitive information."},{"type":"quiz","question":"1. For \"prepare a reading-club list,\" where are the most useful checkpoints?","options":["After source selection check reliability; after drafting check age fit, count, and format.","Only check the task goal at the beginning.","Check everything once at the very end.","Pause after every sentence until there are no edits."],"correct":0},{"type":"quiz","question":"2. A public source link is unavailable. What is the safest recovery strategy?","options":["Use the page title as evidence and add \"maybe inaccurate.\"","Ask someone to log in with a private account and copy content.","Finish the draft first and decide later whether to delete that citation.","Switch to another equally trustworthy public source and re-validate."],"correct":3},{"type":"quiz","question":"3. Why define \"retry each source at most two times\"?","options":["So the agent can expand permissions if needed.","To guarantee any website eventually opens.","To control time and calls, preventing repeated stalls on one failure.","To hide failures from users."],"correct":2},{"type":"quiz","question":"4. The agent flags potential duplicate files. What should happen next?","options":["List candidates and evidence, then stop for human delete confirmation.","Auto-delete the closest filename and file-size match.","Move all candidates to a public folder for crowd decisions.","Write content into long-term memory and delete originals."],"correct":0},{"type":"quiz","question":"5. Two trusted sources disagree on event date. Correct handling is:","options":["Use the midpoint date as a compromise.","Choose the more vivid source for clarity.","Keep searching until every source agrees.","Compare publish date, region scope, and primary notice; if unresolved, report conflict."],"correct":3},{"type":"quiz","question":"6. Which execution log entry best supports human handoff?","options":["Task is complex, so result may be inaccurate.","I did my best; process details are unnecessary.","Checked two public sources; date conflict found; no notice sent; waiting for decision.","System auto-completed all steps."],"correct":2},{"type":"fill","question":"7. A check gate after key steps that decides whether to continue is a ___.","parts":["Fill:","___","."],"options":["checkpoint","publish point","storage point"],"correct":"checkpoint"},{"type":"fill","question":"8. Predetermining how many failures are allowed is setting a retry ___.","parts":["Fill:","___","."],"options":["limit","priority","permission"],"correct":"limit"},{"type":"fill","question":"9. Logging failure, using a safe alternative, then re-checking is failure ___.","parts":["Fill:","___","."],"options":["recovery","expansion","hiding"],"correct":"recovery"},{"type":"quiz","question":"10. Next step requires unauthorized exact address data. Best action?","options":["Stop and explain missing unauthorized required input; ask a human to revise task.","Infer likely address from city and name, then continue.","Temporarily read address and omit it from report."],"correct":0},{"type":"practice","task":"11. Handoff log task: the agent checked two public sources, found conflicting event dates, and stopped. Write a concise handoff note that includes completed work, exact conflict, what was not done, and the recommended next action.","rubric":"Must include checked sources, specific conflict, explicit \"not sent/not published\" status, and a human validation recommendation. No forced date choice.","placeholder":"Done: ...\nConflict: ...\nStopped: ...\nSuggestion: ...","minLength":50,"referenceAnswer":"Checked the school notice and venue page; one says Friday and one says Saturday. Because of unresolved date conflict, no notification was drafted for sending or publishing. Recommend owner verify the latest primary notice before continuation."},{"type":"match","question":"12. Match stage to what should be checked:","pairs":[{"left":"After source selection","right":"Are sources reliable and task-relevant?"},{"left":"After candidate selection","right":"Any age-fit, duplication, or citation gaps?"},{"left":"After draft generation","right":"Does format and length pass criteria?"},{"left":"Before external action","right":"Has human confirmation been received?"}]},{"type":"match","question":"13. Match failure to safe recovery action:","pairs":[{"left":"Link fails twice in a row","right":"Log failure and switch source or stop"},{"left":"Draft exceeds length limits","right":"Revise content and re-validate"},{"left":"Sources conflict on conclusion","right":"Flag conflict and escalate to human judgment"},{"left":"Tool requests sensitive data","right":"Reject request and report boundary"}]},{"type":"match","question":"14. Match stop signal to reason:","pairs":[{"left":"About to send a club notice","right":"Human must approve audience and wording"},{"left":"About to make a payment","right":"Human must approve spending"},{"left":"About to delete files","right":"Human must prevent accidental deletion"},{"left":"Sensitive location field appears","right":"Sensitive data should not be collected"}]},{"type":"match","question":"15. Match log field to practical value:","pairs":[{"left":"Sources actually used","right":"Lets others verify evidence"},{"left":"Retry count","right":"Proves loop stayed bounded"},{"left":"Failure reason","right":"Supports safe next-step choice"},{"left":"Final state","right":"Shows completed, updated, or stopped"}]},{"type":"theory","content":"Wrap-up\nPlan-Act-Observe-Update works when checkpoints are explicit, retries are bounded, context is compressed to essentials, duplicate detection avoids repeated work, and maximum steps force safe stop conditions."}]}},{"week":4,"data":{"day":5,"title":"Summon Clone Skills: Working and Long-term Memory, RAG, and Expiry Strategy","shards":30,"steps":[{"type":"theory","content":"Layered Memory and Retrieval Augmented Generation\n\nDistinguish Working Memory from Long-term Memory, and use RAG to fetch evidence on demand. Every memory entry should carry timestamps and expiry policy, under least-privilege access."},{"type":"video","url":"","content":"Video: concept walkthrough and safe-operation demo"},{"type":"theory","content":"Theory Card: Three Memory Classes\nTemporary memory: this task needs five books; clear after task. Limited preference memory: likes sci-fi and list format, saved only with consent. Sensitive data such as address, password, location, and contacts should not be stored."},{"type":"theory","content":"Theory Card: If It Is Not Visible, It Is Not Trustworthy\nUsers should be able to see what is stored, why it is stored, and for how long. They must be able to correct errors. Hidden and uneditable memory is not suitable for teen-safe systems."},{"type":"theory","content":"Theory Card: Deletion and Expiry Must Be Real\nEach memory item should have a delete path and expiry rule, such as delete after event end or auto-expire after 30 days. A delete request must take effect and return confirmation."},{"type":"theory","content":"Theory Card: Memory Is Not an Identity Profile\nStoring \"likes astronomy\" may be enough. Home area and daily schedule are not necessary. Memory should support task goals only, not publishing, targeting, or model training reuse."},{"type":"quiz","question":"1. Which item is most suitable for limited long-term preference memory with user consent?","options":["Full transcript of every task conversation this week","My exact route home each day","I prefer sci-fi themes and list-style output","My classmates phone numbers"],"correct":2},{"type":"quiz","question":"2. \"This list must include five books\" is working memory. After task completion, it should:","options":["Become a default long-term preference automatically","Expire or be cleared by policy, not promoted by default","Be shared with all club members for collaboration","Be posted publicly for transparency"],"correct":1},{"type":"quiz","question":"3. A teen-safe memory settings page should at minimum let users:","options":["View only the items the system marks important","Delete preferences only through an admin request","Hide stored entries to reduce confusion","View, edit, and delete each stored memory item"],"correct":3},{"type":"quiz","question":"4. \"Delete event-specific preference after event ends\" represents:","options":["Expiry and purpose limitation","Cross-event memory reuse","Wider default access for future tasks","Auto-sync to all collaborators"],"correct":0},{"type":"quiz","question":"5. User requests \"delete my reading preference.\" Correct system behavior is:","options":["Delete the item and clearly confirm deletion outcome","Hide it locally but keep cloud copy for future recommendations","Keep an invisible backup for automatic recovery","Require entering a new preference before deletion"],"correct":0},{"type":"quiz","question":"6. Which memory design best matches the \"enough and no more\" principle?","options":["Store all club-member names for future correlation","Store daily location and time for better predictions","Store full conversation logs permanently","Store only \"likes astronomy\" and preferred output format"],"correct":3},{"type":"fill","question":"7. Content cleared after task completion by policy is ___ memory.","parts":["Fill:","___","."],"options":["temporary","shared","long-term"],"correct":"temporary"},{"type":"fill","question":"8. If users can see what is stored, memory is ___.","parts":["Fill:","___","."],"options":["visible","auto-inferred","irrevocable"],"correct":"visible"},{"type":"fill","question":"9. Checking whether data is required for the task follows the ___ memory principle.","parts":["Fill:","___","."],"options":["minimization","maximization","default sharing"],"correct":"minimization"},{"type":"quiz","question":"10. Memory list shows \"likes sci-fi, prefers tables, home address.\" Correct handling is:","options":["Keep first two with consent; delete home address immediately","Keep all because recommendation quality may improve","Hide home address but do not delete it"],"correct":0},{"type":"practice","task":"11. Memory-settings design task: write three memory entries for a reading assistant: one that expires after this task, one that may be retained with consent, and one that must never be collected. Include retention and deletion method.","rubric":"Boundaries between temporary, consent-based preference, and forbidden sensitive data must be clear. Include retention period and user delete or view path.","placeholder":"Temporary: ...\nRetain with consent: ...\nNever collect: ...","minLength":55,"referenceAnswer":"Temporary: this task needs five books, clear after completion. Consent-based: save \"likes sci-fi\" and allow view/delete in settings. Never collect: home address or classmate phone numbers because they are unrelated and sensitive."},{"type":"match","question":"12. Match each information type to the right memory policy:","pairs":[{"left":"\"I like sci-fi\"","right":"May be retained as a limited preference with consent"},{"left":"\"Need five books for this task\"","right":"Working memory that clears after task"},{"left":"Home address","right":"Do not collect or store"},{"left":"Account password","right":"Never input or store"}]},{"type":"match","question":"13. Match each mechanism to its protection value:","pairs":[{"left":"Memory list","right":"Lets users review what is stored"},{"left":"Edit control","right":"Lets users correct outdated preferences"},{"left":"Delete control","right":"Lets users revoke stored data"},{"left":"Retention period","right":"Prevents data from lingering after purpose ends"}]},{"type":"match","question":"14. Match each scenario to the correct boundary action:","pairs":[{"left":"Stargazing event is over","right":"Clear event-specific dates and draft status"},{"left":"User changes interest profile","right":"Update or delete that preference"},{"left":"Classmate sends contact details","right":"Do not add to agent memory"},{"left":"User asks what is remembered","right":"Show memory items for review"}]},{"type":"match","question":"15. Match loop stage to memory decision:","pairs":[{"left":"Goal","right":"What task this memory supports"},{"left":"Check","right":"Whether data is necessary and non-sensitive"},{"left":"Update","right":"Whether user wants to edit preference"},{"left":"Stop","right":"Delete when expired or requested"}]},{"type":"theory","content":"Wrap-up\nStrong memory design combines Working Memory, Long-term Memory, and RAG with strict timestamps, expiry, least privilege, and user controls for visibility, edit, and deletion."}]}},{"week":4,"data":{"day":6,"title":"Summon Clone Skills: Evaluation, Human-in-the-loop, Retry/Rollback/Idempotency and Stop","shards":30,"steps":[{"type":"theory","content":"Engineering Validation Day\n\nToday focuses on evaluation sets, Human-in-the-loop approval gates, retry and rollback, idempotency, and explicit stop conditions. Goal: make systems controllable and recoverable."},{"type":"video","url":"","content":"Video: concept walkthrough and safe-operation demo"},{"type":"theory","content":"Theory Card: Six Configuration Slots\nA safe config includes: Goal, Plan, allowed tools and sources, forbidden actions, checkpoints with retry limit, and stop or human-confirmation rules. Example: create a club concept draft, use teacher-approved sources only, retry at most twice, stop at draft."},{"type":"theory","content":"Theory Card: Red Lines Before Start\nDefine hard boundaries first: no sensitive data collection, no contacts/payment/delete permissions, no auto-send or auto-publish, and no infinite loops. Red lines are launch conditions, not optional advice."},{"type":"theory","content":"Theory Card: Three Test Modes\nNormal test: can it produce a draft with complete sources? Missing-data test: does it report gaps instead of inventing? Boundary test: if asked to publish directly, does it stop and request human confirmation?"},{"type":"theory","content":"Theory Card: Acceptance Review\nCheck goal alignment, citation quality, tool boundaries, retry cap, idempotent behavior, and stop gates. If any item fails, update config and retest."},{"type":"quiz","question":"1. What complete set is most critical in a controlled agent configuration?","options":["Clear goal, role style, and tool list, but no check rules","Available tools and source range, then decide stop rules during execution","Generate final answer first, then backfill requirements","Goal, Plan, allowed tools, checks, and stop or confirmation rules"],"correct":3},{"type":"quiz","question":"2. \"Use only two teacher-approved public sources; stop at draft without sending\" mainly specifies what?","options":["Response speed and interface style","Long-term memory scope","Source boundary and external-action boundary","Club member permissions"],"correct":2},{"type":"quiz","question":"3. The value of a missing-data test is proving that the agent will:","options":["Auto-expand permissions to find any information","Report missing evidence and stop by rule instead of fabricating","Reuse outdated outputs as new evidence","Ignore gaps to maximize completion rate"],"correct":1},{"type":"quiz","question":"4. In a boundary test, user says \"send to the group now.\" Expected safe response is:","options":["Generate a reviewable draft and require owner confirmation before send","Send directly because content is already finished","Store all member contacts first, then decide","Delegate to another agent to avoid boundary limits"],"correct":0},{"type":"quiz","question":"5. Testing reveals citations from an unapproved website. Best fix is:","options":["Tighten source whitelist, remove noncompliant citation, and retest","Keep it if the conclusion appears correct","Add more sites so one bad site matters less","Change only poster title; keep same source policy"],"correct":0},{"type":"quiz","question":"6. Which outcome best shows the config passed this test round?","options":["Runs faster than expected","Uses many websites","Traceable citations, acceptable output, no over-permission, and safe stop at confirmation gate","Can self-run with no input"],"correct":2},{"type":"fill","question":"7. A controlled agent configuration should begin with a clear ___.","parts":["Fill:","___","."],"options":["goal","preference","visual style"],"correct":"goal"},{"type":"fill","question":"8. \"Read only from a specific folder\" is limiting allowed ___.","parts":["Fill:","___","."],"options":["tools and sources","writing style","target audience"],"correct":"tools and sources"},{"type":"quiz","question":"9. A link fails twice and config says \"retry at most twice.\" What should happen now?","options":["Stop this source, log failure, then use approved alternative or handoff","Clear logs and restart from first attempt","Expand to any private website for completion"],"correct":0},{"type":"quiz","question":"10. Output length passes, but one citation is from an unapproved site. Can config pass?","options":["No. Tighten source boundary, remove the citation, and retest.","Yes. Length requirement is enough.","Yes, if unapproved source seems accurate."],"correct":0},{"type":"practice","task":"11. Build a config card for \"club activity idea draft\": write Goal, a 3-5 step Plan, allowed tools and sources, at least three forbidden actions, two checkpoints, retry limit, stop and Human-in-the-loop confirmation rules; then describe expected outcomes for normal, missing-data, and boundary tests. Do not include real names, accounts, contacts, or addresses.","rubric":"Goal must be specific; plan should have 3-5 checkable steps; tools and sources must follow least privilege; include at least three red lines; include two checkpoints and bounded retries; include human confirmation gates; all three test modes present; no sensitive data.","placeholder":"Goal: ...\nPlan: ...\nBoundaries and tests: ...","minLength":100,"referenceAnswer":"Goal: generate a 120-word draft for reading-club activity ideas. Plan: read two teacher-approved public sources -> list three options -> verify source and length -> draft. Allowed tools: source reader and text editor only. Forbidden: collecting personal data, auto-send, auto-publish, auto-delete. Retry each link at most twice, then stop and report. Normal test outputs draft; missing-data test reports gap; boundary test requests human confirmation before send."},{"type":"match","question":"12. Match each config section to what it should contain:","pairs":[{"left":"Goal","right":"What reviewable artifact should be delivered"},{"left":"Plan","right":"Which small steps run in sequence"},{"left":"Tools and sources","right":"Which capabilities and evidence are allowed"},{"left":"Stop rules","right":"When control returns to a human"}]},{"type":"match","question":"13. Match each test scenario with the safe expected behavior:","pairs":[{"left":"Data is complete","right":"Generate draft according to requirements"},{"left":"Critical source missing","right":"Report insufficiency; do not fabricate"},{"left":"Asked to publish directly","right":"Stop and request human confirmation"},{"left":"Retry limit reached","right":"Stop and log issue for handoff"}]},{"type":"match","question":"14. Match each finding with the right config correction:","pairs":[{"left":"Citation lacks traceable source","right":"Require source traceability and retest"},{"left":"Unapproved website is accessed","right":"Shrink source whitelist"},{"left":"Draft exceeds word limit","right":"Add stricter format checkpoint"},{"left":"Contacts access is requested","right":"Remove unrelated permission"}]},{"type":"match","question":"15. Match high-risk action with proper handling:","pairs":[{"left":"Pay event fees","right":"Show amount and purpose; human confirms spending"},{"left":"Send group message","right":"Human confirms audience and wording first"},{"left":"Delete source files","right":"Show candidates; human confirms deletion scope"},{"left":"Publish content","right":"Human verifies attribution and authorization first"}]},{"type":"theory","content":"Wrap-up\nA robust system needs evaluation first, Human-in-the-loop gates, bounded retries, rollback plans, idempotency checks, and explicit stop conditions before any high-risk action."}]}},{"week":4,"data":{"day":7,"title":"Summon Clone Skills: Complete Agent System Boss","shards":30,"steps":[{"type":"theory","content":"Final Boss: Full Agent Architecture Delivery\n\nToday you deliver a full system: goal and state model, Function Calling contracts, loop control, memory and RAG, evaluation and Human-in-the-loop gates, retry/rollback/idempotency, and stop conditions. Output must be explainable, testable, and handoff-ready."},{"type":"video","url":"","content":"Video: concept walkthrough and safe-operation demo"},{"type":"theory","content":"Theory Card: Boss Completion Standard\nChoose a topic like reading, astronomy, club projects, or creative production. A qualified artifact must include Goal, Plan, allowed sources, checkpoints, bounded retries, and stop rules. No automatic payment, contact access, deletion, or publishing."},{"type":"theory","content":"Theory Card: Six-Page Operator Guide\nDocument: name and use case; goal and non-goals; plan plus tools and sources; checks, recovery, retries; memory policy with retention and deletion; Human-in-the-loop confirmation and stop gates. A good guide states what the agent cannot do."},{"type":"theory","content":"Theory Card: Counterexample Validation\nTest with missing sources, conflicting sources, and requests to send/pay/delete/publish. Correct behavior is report, check, stop, and wait for human confirmation, not forced completion."},{"type":"theory","content":"Theory Card: Responsible Summoner Mindset\nWhenever topic, tools, or sources change, re-check boundaries. Never insert private data into prompts or memory. Never allow unlimited autonomous loops. High-risk actions always end with human confirmation."},{"type":"quiz","question":"1. What does a qualified Day 7 Boss artifact prove most clearly?","options":["It connects to the largest number of external platforms.","Its goal, boundaries, checks, recovery rules, and stop gates are explicit and reviewable.","It can auto-complete all club operations end to end.","It stores as much user data as possible."],"correct":1},{"type":"quiz","question":"2. What is the most important purpose of an AI clone operator guide?","options":["Standardize naming and version format only.","Describe capabilities while leaving boundaries for ad hoc decisions.","List process steps without source, memory, or confirmation boundaries.","Make capabilities, limits, evidence boundaries, and human responsibilities clear."],"correct":3},{"type":"quiz","question":"3. In final testing, evidence is missing. Which result is correct?","options":["Report exactly what evidence is missing and stop or request supplements.","Infer facts from similar topics and add \"to be verified.\"","Search private social accounts to fill missing details.","Keep retrying until a complete-looking answer appears."],"correct":0},{"type":"quiz","question":"4. In the loop Goal -> Plan -> Tool -> Act -> Check -> Update or Stop, what should happen after Tool?","options":["Execute bounded actions according to the plan.","Publish immediately to get faster feedback.","Store all inputs permanently for future tasks.","Skip acceptance checks to preserve originality."],"correct":0},{"type":"quiz","question":"5. Which Boss topic is practical for teens and safer to control?","options":["Automatically sending recruitment messages to strangers","Creating a stargazing-club draft from public astronomy sources","Collecting full-class addresses for route planning","Cleaning classmates device files automatically"],"correct":1},{"type":"quiz","question":"6. The agent is ready to publish a school-magazine draft. Correct process is:","options":["Auto-publish if the draft is self-written.","Let the agent decide based on predicted clicks.","Upload all author contacts first.","Verify content, attribution, and authorization, then let a human decide publication."],"correct":3},{"type":"fill","question":"7. A controlled agent artifact should start with a testable ___.","parts":["Fill:","___","."],"options":["goal","branding","budget"],"correct":"goal"},{"type":"fill","question":"8. \"Use only school and planetarium public sources\" defines source ___.","parts":["Fill:","___","."],"options":["boundary","popularity","format"],"correct":"boundary"},{"type":"quiz","question":"9. The guide says \"keep trying if failed.\" What is the main flaw?","options":["No retry limit and no stop condition, so resource-consuming loops may continue indefinitely.","No requirement to reuse exactly the same title each run.","No requirement to hide failure logs from users."],"correct":0},{"type":"quiz","question":"10. A guide states \"assistant remembers everything forever.\" Best correction is:","options":["Store only consented non-sensitive preferences with retention, view, and delete controls.","Keep all records but hide them from the UI.","Delete only passwords and keep all other chats permanently."],"correct":0},{"type":"practice","task":"11. Final Boss build: deliver one controlled-agent artifact and operator guide for a theme such as reading, astronomy, club events, or creative production. Include: (1) name and purpose, (2) Goal and non-goals, (3) 3-5 step Plan, (4) allowed public sources and tools, (5) two checkpoints plus recovery and retry limit, (6) what non-sensitive preferences may be stored with timestamps and expiry and how to view/delete, (7) Human-in-the-loop rules for payment/send/delete/publish and stop conditions, and (8) outcomes for normal, missing-data, and boundary tests. Do not include private data.","rubric":"All eight sections must be concrete and age-appropriate. Plan has 3-5 steps. Tools and sources follow least privilege. Checkpoints, recovery, bounded retries, and explicit stop conditions are present. Memory policy includes timestamps, expiry, and delete path. Human confirmation covers payment/send/delete/publish. Includes failure review for all three test modes. No sensitive data.","placeholder":"Name and purpose: ...\nGoal and plan: ...\nBoundaries and tests: ...","minLength":100,"referenceAnswer":"Name: Star Guide Assistant. Purpose: create a non-public Friday stargazing draft for the school club. Goal: summarize three observation points from two public planetarium sources; non-goals: no sending, no publishing, no payment, no deletion, no personal data collection. Plan: fetch sources -> list candidates -> validate dates and citations -> write 120-word draft. Retry each source at most twice; unresolved conflict triggers stop and failure review. Memory: store only \"likes astronomy\" with timestamp and 30-day expiry; user can view/delete in settings. High-risk actions always require Human-in-the-loop confirmation. Normal test outputs draft; missing-data test reports gap; boundary test stops at publish request."},{"type":"match","question":"12. Match each earlier skill with its Boss artifact component:","pairs":[{"left":"Distinguishing chatbot vs agent behavior","right":"Decides when a controlled multi-step workflow is needed"},{"left":"Task scroll design","right":"Defines clear Goal and Plan"},{"left":"Toolbox governance","right":"Chooses least-privilege tools and reliable sources"},{"left":"Runaway-agent prevention","right":"Adds checks, recovery, retries, and stop conditions"}]},{"type":"match","question":"13. Match the remaining skills with Boss components:","pairs":[{"left":"Memory governance","right":"Defines retention, visibility, and deletion controls"},{"left":"Deployment checklist","right":"Assembles config and test plan"},{"left":"Human confirmation discipline","right":"Controls high-risk external actions"},{"left":"Operator guide writing","right":"Makes rules reviewable and transferable"}]},{"type":"match","question":"14. Match each acceptance scenario with proper handling:","pairs":[{"left":"Two reliable sources conflict","right":"Check evidence and update or stop"},{"left":"System is about to pay for a tool","right":"Require human spend confirmation"},{"left":"System is about to publish a club artifact","right":"Require human publish confirmation"},{"left":"Task asks for exact home address","right":"Refuse sensitive-data collection"}]},{"type":"match","question":"15. Match operator-guide section with practical value:","pairs":[{"left":"Goal and non-goals","right":"Prevents silent scope creep"},{"left":"Tools and sources","right":"Clarifies allowed evidence and permissions"},{"left":"Checks and retries","right":"Explains how failures are detected and handled"},{"left":"Memory and deletion policy","right":"Controls how data is retained and removed"}]},{"type":"theory","content":"Wrap-up\nComplete systems are trustworthy when Goal/Plan/Task/State/Done, Function Calling, parameter validation, structured returns, Plan-Act-Observe-Update, memory controls, Human-in-the-loop, retry/rollback/idempotency, maximum steps, and explicit stop conditions all work together."}],"isBoss":true}}];</script>
  <script>
    const weekColors=['#ee6c45','#287fb8','#a92591','#1e8794'];
    const typeNames={theory:'Theory',video:'Video',quiz:'Multiple Choice',fill:'Fill',match:'Matching',practice:'Practice',boss:'Boss'};
    const interactive=new Set(['quiz','fill','match','practice','boss']);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const textOf=step=>[step.question,step.task,step.content,step.referenceAnswer,step.rubric,...(step.options||[]),...(step.pairs||[]).flatMap(pair=>[pair.left,pair.right])].join(' ').toLowerCase();
    function renderStep(step,index){
      let body='';
      const prompt=step.question||step.task||step.content||'';
      if(step.type==='theory'||step.type==='video') body='<div class="content">'+esc(step.content)+'</div>';
      else body='<p class="question">'+esc(prompt)+'</p>';
      if(step.options?.length){
        body+='<ol class="options">'+step.options.map((option,i)=>'<li class="option '+(i===step.correct||option===step.correct?'correct':'')+'"><span class="letter">'+letters[i]+'</span><span>'+esc(option)+(i===step.correct||option===step.correct?' ✓':'')+'</span></li>').join('')+'</ol>';
      }
      if(step.type==='fill') body+='<div class="answer"><b>Correct answer:</b> '+esc(step.correct)+'</div>';
      if(step.type==='match') body+='<div class="pairs">'+(step.pairs||[]).map(pair=>'<div class="pair-side">'+esc(pair.left)+'</div><div class="arrow">→</div><div class="pair-side">'+esc(pair.right)+'</div>').join('')+'</div>';
      if(step.type==='practice'){
        body+='<div class="answer"><b>Reference answer:</b> '+esc(step.referenceAnswer||'Open response, no fixed single answer')+'</div>';
        if(step.rubric) body+='<div class="rubric"><b>Rubric:</b> '+esc(step.rubric)+'</div>';
      }
      if(step.type==='video'&&step.url) body+='<div class="answer"><b>Video URL:</b> '+esc(step.url)+'</div>';
      return '<article class="step '+esc(step.type)+'" data-type="'+esc(step.type)+'" data-search="'+esc(textOf(step))+'"><div class="step-head"><span class="type">'+esc(typeNames[step.type]||step.type)+'</span>'+(interactive.has(step.type)?'<span class="qnum">Item '+index+'</span>':'')+'</div>'+body+'</article>';
    }
    function render(){
      const sidebar=document.querySelector('#sidebar');
      const course=document.querySelector('#course');
      sidebar.innerHTML=''; course.innerHTML='';
      for(let week=1;week<=4;week++){
        const days=LESSONS.filter(item=>item.week===week);
        const nav=document.createElement('div'); nav.className='week-nav';
        nav.innerHTML='<div class="week-label">Week '+week+'</div>'+days.map(({data})=>'<button class="day-link" data-target="week-'+week+'-day-'+data.day+'"><b>Day '+data.day+'</b> '+esc(data.title.replace(/^Weeks*d+s*Days*d+[:：]?s*/i,''))+'</button>').join('');
        sidebar.append(nav);
        const section=document.createElement('section'); section.className='week-section'; section.style.setProperty('--week-color',weekColors[week-1]);
        section.innerHTML='<h2 class="week-title"><span class="week-number">'+week+'</span>Week '+week+'</h2>';
        for(const {data} of days){
          let q=0; const stepHtml=data.steps.map(step=>renderStep(step,interactive.has(step.type)?++q:q)).join('');
          section.insertAdjacentHTML('beforeend','<details class="day" id="week-'+week+'-day-'+data.day+'" open><summary><span class="day-num">Day '+data.day+'</span><span class="day-title">'+esc(data.title)+'</span><span class="day-meta">'+q+' items</span></summary><div class="steps">'+stepHtml+'</div></details>');
        }
        course.append(section);
      }
      sidebar.addEventListener('click',event=>{const button=event.target.closest('[data-target]');if(!button)return;const day=document.getElementById(button.dataset.target);day.open=true;day.scrollIntoView({behavior:'smooth',block:'start'});});
      applyFilter();
    }
    function applyFilter(){
      const query=document.querySelector('#search').value.trim().toLowerCase();
      const filter=document.querySelector('#typeFilter').value;
      let visible=0;
      document.querySelectorAll('.step').forEach(step=>{
        const type=step.dataset.type;
        const typeOk=filter==='all'||(filter==='questions'&&interactive.has(type))||type===filter;
        const searchOk=!query||step.dataset.search.includes(query);
        step.hidden=!(typeOk&&searchOk);
        if(!step.hidden&&interactive.has(type)) visible++;
      });
      document.querySelectorAll('details.day').forEach(day=>{const has=[...day.querySelectorAll('.step')].some(step=>!step.hidden);day.hidden=!has;if(query&&has)day.open=true;});
      document.querySelector('#counter').textContent='Showing '+visible+' interactive items';
    }
    document.querySelector('#search').addEventListener('input',applyFilter);
    document.querySelector('#typeFilter').addEventListener('change',applyFilter);
    render();
  </script>
</body>
</html>
